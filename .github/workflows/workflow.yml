name: "joern-demo-npm"

on:
  workflow_dispatch:
    
  push: # Triggers scan-repo flow for every push to the specified branches
    branches:
      - main
    # paths:
    #   - 'src/**'
    #   - 'Dockerfile'
    #   - 'README.md'

permissions:
  pull-requests: write
  contents: read
  security-events: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    #env:
    #  NPM_TOKEN: ${{ secrets.DEBUG_TOKEN }}
    # strategy:
    #   matrix:
    #     # The repository scanning will be triggered periodically on the following branches.
    #     branch: ["main"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
          JF_URL: ${{ vars.JF_URL }}
          #JF_PROJECT: ${{ vars.JF_PROJECT }}
          # 01 no effect##JFROG_CLI_BUILD_PROJECT: ${{ vars.JF_PROJECT }}
          ##JFROG_CLI_LOG_LEVEL: DEBUG
        with:
          oidc-provider-name: joern-github
          #version: 2.81.0

      - name: JFrog CLI Test
        run: |
          jf rt ping

      - name: Authenticate Docker Repo
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_URL }}
          username: ${{ steps.setup-cli.outputs.oidc-user }}
          password: ${{ steps.setup-cli.outputs.oidc-token }}


      - name: Scan Source (SCA + Contextual Analysis + Secrets + SAST + Snippet Detection)
        run: |
          jf audit \
            --sca --sast --secrets \
            --static-sca \
            --snippet \
            --sbom \
            --extended-table \
            --format=table | tee scan-result-audit
        # --static-sca resolves dependencies from the lock file without running npm (no build needed).
        # --snippet enables Snippet Detection (requires --static-sca); identifies the open-source origin
        #   of copied/AI-generated code and its license/security risk. Requires JFrog CLI >= 2.95.0 and a
        #   Unified Security (or higher) entitlement. Full results are also pushed to the JFrog Platform.
        # Add --watches "<watch>" or --project "<key>" to evaluate against an Xray policy/watch.

      - name: Push Source Code Artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-code-scan
          path: scan-result-audit


      - name: Setup Node npm
        uses: actions/setup-node@v3
           
      - name: Setup npm-config
        run: jf npm-config --global=true --repo-resolve=joern-npm-remote --repo-deploy=joern-npm-local
                      
      - name: Install Deps
        #working-directory: ./src
        run: jf npm install

      # - name: debug
      #   if: always()  
      #   #working-directory: ./
      #   run: |
      #     cat .npmrc

      # - name: debug2
      #   if: always()  
      #   #working-directory: ./src
      #   run: |
      #     cat .npmrc

      - name: Start App
        #working-directory: ./src
        run: |
           npm start &
           npx wait-on http://localhost:3000 -t 30000
           
      - name: Run tests
        #working-directory: ./src
        run: npm test
         
      - name: Publish
        #working-directory: ./src
        run: jf npm publish

      - name: Build Docker Image
        working-directory: ./
        env:
          IMAGE_NAME: solengeu.jfrog.io/joern-docker-local/myapp-image:${{ github.run_number }}
        run: |
          jf docker build -t $IMAGE_NAME .

      - name: Collect Docker Build Environment
        run: jf rt bce 

      - name: Scan Docker Image
        working-directory: ./
        env:
          IMAGE_NAME: solengeu.jfrog.io/joern-docker-local/myapp-image:${{ github.run_number }}
        run: |
          jf docker scan $IMAGE_NAME \
            --format=json  > scan-result-image.json \
            --detailed-summary \
            --licenses

      - name: Push Docker Image
        working-directory: ./
        env:
          IMAGE_NAME: solengeu.jfrog.io/joern-docker-local/myapp-image:${{ github.run_number }}
        run: |
          jf docker push $IMAGE_NAME


      - name: Push Scan Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-image
          path: scan-result-image.json


      - name: Publish Build info With JFrog CLI
        #working-directory: ./src
        run: |
          # Collect environment variables for the build
          jf rt build-collect-env
          # Collect VCS details from git and add them to the build
          jf rt build-add-git
          # Publish build info
          ##jf rt build-publish --detailed-summary --env-include="*" --project=myapp
          jf rt build-publish --detailed-summary

      # - name: Wait 30s for Indexing
      #   run: |
      #     sleep 30

      - name: Buld scan
        run: |
          jf build-scan # Build Info in GitHub Summary: Security Issues
